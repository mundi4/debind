name: Package addon

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: packager

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # 시크릿은 자동으로 env에 들어오지 않는다. 이 줄이 없으면 packager가
      # X-Curse-Project-ID를 읽고도 "CurseForge ID: 970278"만 찍고 업로드는 건너뛴다.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -q

      - name: Package and release
        uses: BigWigsMods/packager@master
