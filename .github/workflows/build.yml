name: Package addon

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: packager

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # 시크릿은 자동으로 env에 들어오지 않는다. 이 줄이 없으면 packager가
      # X-Curse-Project-ID를 읽고도 "CurseForge ID: 970278"만 찍고 업로드는 건너뛴다.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -q

      - name: Package and release
        uses: BigWigsMods/packager@master
        with:
          # zip 파일 이름만 Debind로 가른다. 기본 템플릿이 `{package-name}`이라 그냥 두면
          # `Debounce-3.0.zip`이 나오는데, 그 값(.pkgmeta의 package-as)은 폴더 이름이 걸려
          # 있어서 못 바꾼다 - 그래서 토큰 자리에 리터럴을 박았다.
          #
          # 콜론 뒤는 릴리즈 라벨(기본 `{project-version}{classic}{nolib}`)이다. 생략하면
          # release.sh가 `${OPTARG##*:}`로 같은 문자열을 집어 라벨까지 파일 이름이 된다.
          args: -n "Debind-{project-version}{nolib}{classic}:{project-version}{classic}{nolib}"
