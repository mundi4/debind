name: Package addon

on:
  push:
    tags:
      - '**'
  # workflow_dispatch는 일부러 없다. 태그 없이 이걸 돌리면 packager가 알파를
  # 만들어 CurseForge와 Wago에 그대로 올린다 - 설정이 맞는지 보려고 누른 순간
  # 양쪽에서 지워야 할 것이 생긴다. 그리고 업로드를 건너뛰는 드라이런은
  # 정작 토큰이 먹는지를 검증하지 못하므로, 시험할 방법이 애초에 없다.
  # 실패한 실행은 Actions 화면에서 재실행하면 된다.

concurrency:
  group: packager

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # 시크릿은 자동으로 env에 들어오지 않는다. 이 줄이 없으면 packager가
      # X-Curse-Project-ID를 읽고도 "CurseForge ID: 970278"만 찍고 업로드는 건너뛴다.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      # Wago도 같은 이유로 이 줄이 필요하다. 다만 이것만으로는 아무 일도
      # 일어나지 않는다 - 올릴 대상은 TOC의 X-Wago-ID가 정하고, 그 줄이
      # 없으면 packager는 Wago를 통째로 건너뛴다.
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -q

      # **`-n` 오버라이드가 여기 있었는데 이제 필요 없다.** 기본 템플릿의 `{package-name}`이
      # `.pkgmeta`의 package-as인데, 그게 폴더 이름에 묶여 `Debounce`로 고정돼 있던 시절에는
      # zip 이름만 Debind로 가르려고 리터럴을 박아야 했다. 폴더가 개명되면서 package-as가
      # `Debind`가 됐으므로 기본값이 그대로 `Debind-<버전>.zip`을 만든다.
      #
      # **`-q`도 있었는데 release.sh가 그 옵션을 없앴다.** 3.1 태그가 인자 파싱에서
      # 죽었다: `Unknown option "-q"`. 8월 7일 3.0은 같은 줄로 통과했으므로 상류가
      # 그 사이에 지운 것이다 - @master로 물려 있으면 이런 것이 우리 커밋과 무관하게
      # 다음 태그에서 터진다. 지금은 조용한 옵션이 아예 없어서 그냥 뗀다.
      - name: Package and release
        uses: BigWigsMods/packager@master
